services:
  app:
    image: ghcr.io/na3shkw/comix-viewer:${APP_VERSION:-latest}
    volumes:
      - type: bind
        source: ${COMIC_DIR}
        target: /data/comic_image
      - type: volume
        source: viewer_data
        target: /data/sqlite
      - type: volume
        source: static_content
        target: /srv/static
    expose:
      - "5000"

  nginx:
    image: nginx:1.29.0-alpine-slim
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
      - type: bind
        source: ${COMIC_DIR}
        target: /data/comic_image
      - type: volume
        source: static_content
        target: /app/static
        read_only: true
    depends_on:
      - app

volumes:
  viewer_data:
  static_content:
