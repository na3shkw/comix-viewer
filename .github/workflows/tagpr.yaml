name: tagpr

on:
  push:
    branches:
      - main

jobs:
  tagpr:
    runs-on: ubuntu-24.04
    outputs:
      tagpr-tag: ${{ steps.run-tagpr.outputs.tag }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run tagpr
        id: run-tagpr
        uses: Songmu/tagpr@v1.21.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push-docker-image:
    needs: tagpr
    if: needs.tagpr.outputs.tagpr-tag != ''
    permissions:
      attestations: write
      packages: write
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-image.yaml
    with:
      tag: ${{ needs.tagpr.outputs.tagpr-tag }}

  publish-release:
    needs: [tagpr, push-docker-image]
    if: needs.tagpr.outputs.tagpr-tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Publish release
        run: gh release edit "$TAG_NAME" --draft=false --latest
        env:
          TAG_NAME: ${{ needs.tagpr.outputs.tagpr-tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
